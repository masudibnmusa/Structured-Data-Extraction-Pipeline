services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: extraction
      POSTGRES_PASSWORD: extraction
      POSTGRES_DB: extraction
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extraction"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment: &shared-env
      DATABASE_URL: postgresql://extraction:extraction@db:5432/extraction
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A app.pipeline.batch_processor.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment: *shared-env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  review:
    build: .
    command: streamlit run app/review_queue/review_ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment: *shared-env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: